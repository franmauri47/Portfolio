<section class="description" aria-label="Descripción del portfolio">
  <div class="terminal-window">
    <div class="terminal-title">
      <span class="dot dot--red" aria-hidden="true"></span>
      <span class="dot dot--yellow" aria-hidden="true"></span>
      <span class="dot dot--green" aria-hidden="true"></span>
      <span class="terminal-label">terminal</span>
    </div>
    <div class="terminal-body">
      <p class="terminal-line">
        <span class="prompt">$</span>
        <span class="typing" aria-live="polite">{{ typedText() }}</span>
        <span class="cursor" aria-hidden="true">▮</span>
      </p>
    </div>
  </div>
</section>
